services:
  flimflam_db:
    image: postgres:16-alpine
    container_name: flimflam_postgres_prod
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - flimflam_prod_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # We use the env variables with defaults to ensure the healthcheck passes
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flimflam_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: flimflam_api_prod
    restart: always
    ports:
      - "80:5000" # Map EC2 Port 80 to API Port 5000
    env_file:
      - .env
    environment:
      # Ensure the app knows to look for the DB service by its name
      - DB_HOST=flimflam_db
    depends_on:
      flimflam_db:
        condition: service_healthy

volumes:
  flimflam_prod_data:
