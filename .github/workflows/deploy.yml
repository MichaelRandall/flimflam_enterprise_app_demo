name: Deploy Frontend to S3

on:
  push:
    branches: [ main ]  # Triggers every time you push to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & Build
        working-directory: ./frontend  # Make sure this matches your folder name!
        env:
          # This injects your EC2 IP so the React app knows where the API is
          REACT_APP_API_URL: http://${{ secrets.EC2_PUBLIC_IP }}
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 # Change if you deployed to a different region

      - name: Deploy to S3
        run: |
          # The bucket name is in your CloudFormation Outputs
          aws s3 sync ./frontend/build s3://${{ secrets.S3_BUCKET_NAME }} --delete

      - name: Invalidate CloudFront Cache
        run: |
          # This ensures users see the new version immediately
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_ID }} --paths "/*"

