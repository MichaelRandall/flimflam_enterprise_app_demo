apiVersion: v1
kind: ConfigMap
metadata:
  name: flimflam-config
  namespace: flimflam
data:
  DB_HOST: "flimflam-db"
  DB_PORT: "5432"
  POSTGRES_DB: "flimflam_db"
  PORT: "5000"

---
apiVersion: v1
kind: Secret
metadata:
  name: flimflam-secrets
  namespace: flimflam
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "my_postgres_password"
  JWT_SECRET: "my_jwt_secret"