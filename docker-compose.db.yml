services:
  db:
    image: postgres:16-alpine
    container_name: shared_postgres_db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432" 
    volumes:
      - shared_db_data:/var/lib/postgresql/data 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  shared_db_data:
